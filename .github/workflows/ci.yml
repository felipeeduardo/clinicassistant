name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown links
        run: bash scripts/docs/validate-docs.sh
      - name: Validate Postman collection and environments
        run: bash scripts/postman/validate-collection.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ClinicAssistant.sln
      - run: dotnet build ClinicAssistant.sln --no-restore --configuration Release
      - run: dotnet test ClinicAssistant.sln --no-build --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, documentation]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose --profile e2e up -d --build postgres rabbitmq redis api worker frontend
        env:
          DATABASE_TARGET: test
          POSTGRES_DB: clinicassistant
          DATABASE_NAME: clinicassistant_test
          TEST_DATA_ALLOWED_DATABASES: clinicassistant_test
          E2E_DEFAULT_PASSWORD: ClinicAssistant-E2E-Only-2026
          WHATSAPP_TEST_RECIPIENT: +550000000301
      - name: Wait for API and frontend health
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health/ready
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/login
      - name: Detect OpenAPI and Postman drift
        run: bash scripts/postman/check-openapi-drift.sh http://127.0.0.1:8080/swagger/v1/swagger.json
      - run: docker compose --profile e2e run --rm test-data-seeder e2e
        env:
          DATABASE_TARGET: test
          POSTGRES_DB: clinicassistant
          DATABASE_NAME: clinicassistant_test
          TEST_DATA_ALLOWED_DATABASES: clinicassistant_test
          E2E_DEFAULT_PASSWORD: ClinicAssistant-E2E-Only-2026
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_DEFAULT_PASSWORD: ClinicAssistant-E2E-Only-2026
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
      - if: failure()
        name: Collect container diagnostics
        run: docker compose --profile e2e logs --no-color > docker-compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
      - if: always()
        run: docker compose --profile e2e down -v
