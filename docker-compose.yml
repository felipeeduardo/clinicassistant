name: clinic-assistant

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-clinicassistant};Username=${POSTGRES_USER:-clinicassistant};Password=${POSTGRES_PASSWORD:-clinicassistant}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USERNAME:-clinicassistant}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-clinicassistant}
      RabbitMq__OutboxBatchSize: ${RABBITMQ_OUTBOX_BATCH_SIZE:-50}
      RabbitMq__OutboxPollingSeconds: ${RABBITMQ_OUTBOX_POLLING_SECONDS:-5}
      RabbitMq__MaximumRetryAttempts: ${RABBITMQ_MAXIMUM_RETRY_ATTEMPTS:-4}
      RabbitMq__ConsumerPrefetchCount: ${RABBITMQ_CONSUMER_PREFETCH_COUNT:-20}
      Redis__Host: redis
      Redis__Port: 6379
      Jwt__Issuer: ${JWT_ISSUER:-ClinicAssistant}
      Jwt__Audience: ${JWT_AUDIENCE:-ClinicAssistant.Web}
      Jwt__Secret: ${JWT_SECRET:-development-only-secret-change-before-production-2026}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      WhatsApp__Provider: ${WHATSAPP_PROVIDER:-Fake}
      WhatsApp__MaximumRetryAttempts: ${WHATSAPP_MAXIMUM_RETRY_ATTEMPTS:-3}
      WhatsApp__RequestTimeoutSeconds: ${WHATSAPP_REQUEST_TIMEOUT_SECONDS:-15}
      WhatsApp__RawPayloadRetentionDays: ${WHATSAPP_RAW_PAYLOAD_RETENTION_DAYS:-30}
      WhatsApp__MaxWebhookBodySizeBytes: ${WHATSAPP_MAX_WEBHOOK_BODY_SIZE_BYTES:-1048576}
      WhatsApp__Media__MaxFileSizeBytes: ${WHATSAPP_MEDIA_MAX_FILE_SIZE_BYTES:-10485760}
      WhatsApp__Media__AllowedTypes: ${WHATSAPP_MEDIA_ALLOWED_TYPES:-image/jpeg,image/png,application/pdf,audio/ogg}
      WhatsApp__Fake__DelayMilliseconds: ${WHATSAPP_FAKE_DELAY_MILLISECONDS:-100}
      WhatsApp__Fake__FailureMode: ${WHATSAPP_FAKE_FAILURE_MODE:-None}
      WhatsApp__Fake__FailureRate: ${WHATSAPP_FAKE_FAILURE_RATE:-0}
      Conversation__StateExpirationMinutes: ${CONVERSATION_STATE_EXPIRATION_MINUTES:-30}
      Conversation__IdleCloseHours: ${CONVERSATION_IDLE_CLOSE_HOURS:-24}
      Conversation__MaximumInvalidAttempts: ${CONVERSATION_MAXIMUM_INVALID_ATTEMPTS:-3}
      Conversation__LockTimeoutSeconds: ${CONVERSATION_LOCK_TIMEOUT_SECONDS:-10}
      Conversation__LockTtlSeconds: ${CONVERSATION_LOCK_TTL_SECONDS:-60}
      Conversation__MaxOptionsPerMessage: ${CONVERSATION_MAX_OPTIONS_PER_MESSAGE:-10}
      Conversation__MaxMessageLength: ${CONVERSATION_MAX_MESSAGE_LENGTH:-2000}
      Conversation__DefaultLanguage: ${CONVERSATION_DEFAULT_LANGUAGE:-pt-BR}
      Conversation__ReopenClosedConversations: ${CONVERSATION_REOPEN_CLOSED_CONVERSATIONS:-true}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-}
      Twilio__MessagingServiceSid: ${TWILIO_MESSAGING_SERVICE_SID:-}
      Twilio__IncomingWebhookBaseUrl: ${TWILIO_INCOMING_WEBHOOK_BASE_URL:-}
      Twilio__StatusCallbackBaseUrl: ${TWILIO_STATUS_CALLBACK_BASE_URL:-}
      Twilio__RequestTimeoutSeconds: ${TWILIO_REQUEST_TIMEOUT_SECONDS:-15}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [clinic-assistant]

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-clinicassistant};Username=${POSTGRES_USER:-clinicassistant};Password=${POSTGRES_PASSWORD:-clinicassistant}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USERNAME:-clinicassistant}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-clinicassistant}
      RabbitMq__OutboxBatchSize: ${RABBITMQ_OUTBOX_BATCH_SIZE:-50}
      RabbitMq__OutboxPollingSeconds: ${RABBITMQ_OUTBOX_POLLING_SECONDS:-5}
      RabbitMq__MaximumRetryAttempts: ${RABBITMQ_MAXIMUM_RETRY_ATTEMPTS:-4}
      RabbitMq__ConsumerPrefetchCount: ${RABBITMQ_CONSUMER_PREFETCH_COUNT:-20}
      Redis__Host: redis
      Redis__Port: 6379
      Jwt__Issuer: ${JWT_ISSUER:-ClinicAssistant}
      Jwt__Audience: ${JWT_AUDIENCE:-ClinicAssistant.Web}
      Jwt__Secret: ${JWT_SECRET:-development-only-secret-change-before-production-2026}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      WhatsApp__Media__MaxFileSizeBytes: ${WHATSAPP_MEDIA_MAX_FILE_SIZE_BYTES:-10485760}
      WhatsApp__Media__AllowedTypes: ${WHATSAPP_MEDIA_ALLOWED_TYPES:-image/jpeg,image/png,application/pdf,audio/ogg}
      Conversation__StateExpirationMinutes: ${CONVERSATION_STATE_EXPIRATION_MINUTES:-30}
      Conversation__IdleCloseHours: ${CONVERSATION_IDLE_CLOSE_HOURS:-24}
      Conversation__MaximumInvalidAttempts: ${CONVERSATION_MAXIMUM_INVALID_ATTEMPTS:-3}
      Conversation__LockTimeoutSeconds: ${CONVERSATION_LOCK_TIMEOUT_SECONDS:-10}
      Conversation__LockTtlSeconds: ${CONVERSATION_LOCK_TTL_SECONDS:-60}
      Conversation__MaxOptionsPerMessage: ${CONVERSATION_MAX_OPTIONS_PER_MESSAGE:-10}
      Conversation__MaxMessageLength: ${CONVERSATION_MAX_MESSAGE_LENGTH:-2000}
      Conversation__DefaultLanguage: ${CONVERSATION_DEFAULT_LANGUAGE:-pt-BR}
      Conversation__ReopenClosedConversations: ${CONVERSATION_REOPEN_CLOSED_CONVERSATIONS:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [clinic-assistant]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicassistant}
      POSTGRES_USER: ${POSTGRES_USER:-clinicassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicassistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [clinic-assistant]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-clinicassistant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-clinicassistant}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [clinic-assistant]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [clinic-assistant]

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  clinic-assistant:
    driver: bridge
